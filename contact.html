<!DOCTYPE html>
<html>

<head>
    <title>PinkGoose 3</title>
    <link rel="stylesheet" href="style css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/94b31cba6c.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- Top of the page -->

    <header class="container">
        <a>
            <h2 class="logo">Pink <span class="pink">Goose</span></h2>
        </a>
        <nav class="links">
            <a href="index.html">Home</a>
            <a href="learn.html">Learn</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a class="button-login">Login</a>
    </header>

    <!-- Goose Idea -->

    <section class="container goose-idea">
        <div class="idea">
            <h1>What's your GOOSE idea?</h1>
            <div>Let's chat and see how we can help</div>
        </div>
        <div class="goose-help">
            <div class="telegram">
                <div>
                    <img src="afbeeldingen pink goose/random/framefooter2.png" alt="telegram">
                </div>
                <div class="telegram-team">
                    <div>Telegram</div>
                    <div class="superdao-team">@superdao_team</div>
                </div>
            </div>
            <div class="email">
                <div>
                    <img src="afbeeldingen pink goose/random/framefooter3.png" alt="email">
                </div>
                <div class="email-team">
                    <div>Email</div>
                    <div class="hello-superdao">hello@superdao.co</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Post -->

    <section class="post">
        <h1>Send a post Goose</h1>
        <form>
            <input class="email-post" type="email" placeholder="Your email" name="email">
            <input class="email-post" type="text" placeholder="Your name" name="text">
            <textarea class="message" placeholder="Your message" name="text"></textarea>
            <select class="goose-color" aria-label="Color of your goose" name="selector">
                <option value="" disabled selected>Color of your goose</option>
                <option value="red">Red</option>
                <option value="white">White</option>
                <option value="blue">Blue</option>
                <option value="black">Black</option>
            </select>
            <button name="submit" class="post-send" type="submit">Send</button>
        </form>
    </section>

    <!-- Bottom of the page -->

    <footer class="footer">
        <div class="footer-link">
            <div>About</div>
            <div>Jobs</div>
            <div class="yellow">Legal</div>
        </div>
        <div class="footer-image">
            <img src="afbeeldingen pink goose/socials/twitter.png" alt="Twitter">
            <img src="afbeeldingen pink goose/socials/telegram.png" alt="Telegram">
            <img src="afbeeldingen pink goose/socials/youtube.png" alt="Youtube">
            <img src="afbeeldingen pink goose/socials/discord.png" alt="Discord">
        </div>
    </footer>
</body>

</html>
