<!DOCTYPE html>
<html>

<head>
    <title>PinkGoose 3</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/94b31cba6c.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- Top of the page -->

    <header class="container">
        <a>
            <h2 class="logo">Pink <span class="pink">Goose</span></h2>
        </a>
        <nav class="links">
            <a href="index.html">Home</a>
            <a href="learn.html">Learn</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a class="buttonlogin">Login</a>
    </header>

    <!-- Goose Idea -->

    <section class="container gooseidea">
        <section class="idea">
            <h1>What's your GOOSE idea?</h1>
            <div>Let's chat and see how we can help</div>
        </section>
        <section class="goosehelp">
            <section class="telegram">
                <section>
                    <img src="Afbeeldingen Pink Goose/Random/Group 5531.png" alt="telegram">
                </section>
                <section class="telegramteam">
                    <div>Telegram</div>
                    <div class="superdaoteam">@superdao_team</div>
                </section>
            </section>
            <section class="email">
                <section>
                    <img src="Afbeeldingen Pink Goose/Random/Group 5640.png" alt="email">
                </section>
                <section class="emailteam">
                    <div>Email</div>
                    <div class="hellosuperdao">hello@superdao.co</div>
                </section>
            </section>
        </section>
    </section>
    <section class="post">
        <h1>Send a post Goose</h1>
        <input class="emailpost" type="email" placeholder="Your email">
        <input type="email" placeholder="Your name">
        <textarea class="message" placeholder="Your message"></textarea>
        <select class="goose-color" aria-label="Color of your goose">
            <option value="" disabled selected>Color of your goose</option>
            <option value="red">Red</option>
            <option value="white">White</option>
            <option value="blue">Blue</option>
            <option value="black">Black</option>
        </select>
        <button class="post-send" type="button">Send</button>
    </section>

    <!-- Bottom of the page -->

    <footer class="footer">
        <div class="footerlink">
            <div>About</div>
            <div>Jobs</div>
            <div class="yellow">Legal</div>
        </div>
        <div class="footerimage">
            <img src="Afbeeldingen Pink Goose/Socials/Frame 5609.png" alt="Twitter">
            <img src="Afbeeldingen Pink Goose/Socials/Frame 5609 (1).png" alt="Telegram">
            <img src="Afbeeldingen Pink Goose/Socials/Frame 5609 (2).png" alt="Youtube">
            <img src="Afbeeldingen Pink Goose/Socials/discord_1 1.png" alt="Discord">
        </div>  
    </footer>    
</body>

</html>
